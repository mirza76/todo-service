apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below the desired replica count
  selector:
    matchLabels:
      app.kubernetes.io/name: todo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: todo-api
      annotations:
        # Conventional annotations for Prometheus pod discovery.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: todo-api
      automountServiceAccountToken: false
      # Must exceed SHUTDOWN_DELAY + SHUTDOWN_TIMEOUT (5s + 15s).
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across nodes so one node failure can't take out both.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: todo-api
      containers:
        - name: todo-api
          image: todo-api
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # Separate listener: metrics are not exposed through the Service.
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: todo-api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: todo-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-db
                  key: password
            # Soft memory limit for the Go GC, derived from the container
            # limit, so the runtime collects harder before the kernel
            # OOM-kills the pod. (GOMAXPROCS already follows the CPU limit
            # automatically since Go 1.25.)
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          # Allows up to 60s for startup (DB connect retries + migrations)
          # before liveness takes over.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Process health only; no dependency checks (avoids restart storms).
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Dependency health; failing removes the pod from the Service.
          # timeoutSeconds exceeds the app's 2s internal check timeout.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
