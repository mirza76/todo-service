# Local cluster: one control plane and two workers, so the two API replicas
# land on different nodes and failure drills are realistic.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: todo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080 # todo-api-nodeport Service
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
